name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: iggen_linux_amd64.tar.gz
            archive_cmd: tar -czf
          - os: macos-latest
            asset_name: iggen_darwin_arm64.tar.gz
            archive_cmd: tar -czf
          - os: windows-latest
            asset_name: iggen_windows_amd64.zip
            archive_cmd: powershell Compress-Archive

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup MSVC + Ninja (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      # GitHub-hosted runners have vcpkg pre-installed at $VCPKG_INSTALLATION_ROOT
      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake --preset release -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      # Package as an archive per PACKAGE_GUIDE (archive format preferred over bare binary).
      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp build/release/iggen staging/iggen
          tar -czf "${{ matrix.asset_name }}" -C staging iggen

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp build/release/iggen.exe staging/iggen.exe
          powershell -Command "Compress-Archive -Path staging/iggen.exe -DestinationPath '${{ matrix.asset_name }}'"

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
