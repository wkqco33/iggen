name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check clang-format
        run: |
          sudo apt-get install -y clang-format
          clang-format --dry-run --Werror src/*.cpp include/*.hpp tests/*.cpp

  test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup MSVC + Ninja (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: Set VCPKG_ROOT and Binary Cache
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$HOME/vcpkg_cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$HOME/vcpkg_cache" >> "$GITHUB_ENV"

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: ~/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        shell: bash
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Run Tests
        shell: bash
        run: ctest --preset debug --output-on-failure < /dev/null
